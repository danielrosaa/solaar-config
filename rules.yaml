%YAML 1.3
---
- Rule:
  - Key: [Lang Switch, pressed]
  - KeyPress:
    - Insert
    - click
- Rule:
  - Key: [Left Tilt, pressed]
  - KeyPress:
    - XF86_AudioLowerVolume
    - click
- Rule:
  - Key: [Right Tilt, pressed]
  - KeyPress:
    - XF86_AudioRaiseVolume
    - click
- Rule:
  - Key: [Screen Capture, pressed]
  - Execute: spectacle
- Rule:
  - Key: [Calculator, pressed]
  - Execute: [bash, reconnect_vpn]
...
---
- Rule:
  - MouseGesture: Mouse Left
  - KeyPress:
    - XF86_AudioPrev
    - click
- Rule:
  - MouseGesture: Mouse Right
  - KeyPress:
    - XF86_AudioNext
    - click
- Rule:
  - Key: [MultiPlatform Gesture Button, pressed]
  - KeyPress:
    - XF86_AudioPlay
    - click
...
